<form action="{{ action_url }}" method="POST">
    <div class="mb-3">
        <label for="username" class="form-label">用户名</label>
        <input type="text" class="form-control" id="username" name="username"
               placeholder="请输入用户名" required autofocus autocomplete="username">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">密码</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="请输入密码" required autocomplete="{{ password_autocomplete }}">
    </div>
    {% if show_confirm %}
    <div class="mb-3">
        <label for="confirm" class="form-label">确认密码</label>
        <input type="password" class="form-control" id="confirm" name="confirm"
               placeholder="请再次输入密码" required autocomplete="new-password">
    </div>
    {% endif %}
    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">{{ submit_text }}</button>
    </div>
</form>
<p class="mt-3 text-center">
    {{ footer_text | safe }}
</p>
